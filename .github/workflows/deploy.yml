name: Deploy API to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Tự động chạy khi bạn gộp hoặc push code mới vào nhánh main
  workflow_dispatch: # Bật nút kích hoạt thủ công từ giao diện GitHub

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
          
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # BẠN CẦN THAY ĐỔI DÒNG DƯỚI ĐÂY:
        # 1. Thay "TEN_USER_HF_CUA_BAN" bằng Tên đăng nhập Hugging Face của bạn (ở 2 vị trí).
        # 2. Thay "AITutor-API" bằng Tên Space mà bạn vừa tạo trên Hugging Face.
        run: git push --force https://PhanHuuAnNguyen:$HF_TOKEN@huggingface.co/spaces/PhanHuuAnNguyen/AITutor-API HEAD:main
