name: Deploy API to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Tự động chạy khi bạn gộp hoặc push code mới vào nhánh main
  workflow_dispatch: # Bật nút kích hoạt thủ công từ giao diện GitHub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend tests
        run: node --test tests/frontend_chat_visualization.test.cjs

  sync-to-hub:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Xóa lịch sử git cũ để tránh đẩy các commit chứa file nặng không dùng LFS lên HF
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          
          # Thiết lập Git LFS cho ảnh (Bắt buộc theo quy định của Hugging Face)
          git lfs install
          git lfs track "*.png" "*.jpg" "*.jpeg" "*.gif" "*.pdf" "*.docx" "*.xlsx" "*.zip" "*.mp4"
          git add .gitattributes
          
          # Commit và Push ghi đè (force)
          git add .
          git commit -m "Auto deploy to Hugging Face"
          git push --force https://PhanHuuAnNguyen:$HF_TOKEN@huggingface.co/spaces/PhanHuuAnNguyen/AITutor-API main
